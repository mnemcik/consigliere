name: PR Title Lint

# Validates the PR title against Conventional Commits. We squash-merge, so the PR
# title becomes the sole commit on main — which release-please parses to derive the
# next version and CHANGELOG. This is the single Conventional-Commits enforcement point.
#
# Runs on `pull_request`, not `pull_request_target`: GitHub blocks `pull_request_target`
# in public repositories from 2026-12-02, and the action needs only a read-only token,
# which pull requests from forks get on `pull_request`.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
