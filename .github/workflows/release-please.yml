name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived GitHub App installation token. The default GITHUB_TOKEN
      # cannot trigger downstream workflows, which would leave the Release PR's
      # required CI checks approval-blocked and the published release unable to
      # fire the GoReleaser workflow. The App token (≈1h, repo-scoped) escapes both.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          # Downscope the minted token to exactly what release-please needs
          # (least privilege; guards against future installation permission creep).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
