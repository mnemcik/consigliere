name: Upstream Proposal Gate

# Every PR changes what every workspace gets on `cg sync`, whoever opens it: an agent
# session in a workspace (an upstream proposal), a community contributor, or the
# maintainer. So every PR except the release and dependency bots needs the
# maintainer's impact review, marked by the `impact-reviewed` label (CONTRIBUTING.md
# "Impact review").
#
# New commits reset the review: the gate fails on `synchronize` (and on `reopened`,
# since pushes to a closed PR's branch fire no `synchronize`) whatever the labels say,
# because the event payload still carries `impact-reviewed`, and the label removal
# below uses GITHUB_TOKEN, whose events start no workflow runs. Re-adding the label
# fires `labeled`, which re-runs the gate on the new head.
#
# On the other events the gate reads the PR's current labels from the API, not the
# payload snapshot, and runs for one PR are queued (concurrency group), so a label
# event right after a push sees the label already removed.
#
# Nothing is checked out, and no PR-controlled text (title, body, branch name)
# reaches a shell: only the author login, the action, the repo and the PR number.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions: {}

concurrency:
  group: upstream-proposal-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    # The job name is the required status check on main; keep it.
    name: Upstream proposal reviewed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$AUTHOR" in
            'consigliere-release-bot[bot]' | 'dependabot[bot]' | 'renovate[bot]')
              echo "ok (bot PR by $AUTHOR: no impact review)"
              exit 0
              ;;
          esac
          if [ "$ACTION" = "synchronize" ] || [ "$ACTION" = "reopened" ]; then
            echo "::error::New commits since the impact review (or a reopened PR). Review the new commits' impact, then add the impact-reviewed label again."
            exit 1
          fi
          # Current labels, not the payload snapshot. Fails closed if the call fails.
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if ! printf '%s\n' "$labels" | grep -qx 'impact-reviewed'; then
            echo "::error::Review this PR's impact on every workspace, then add the impact-reviewed label."
            exit 1
          fi
          echo "ok (impact-reviewed)"

  drop-review-label:
    # Makes the reset visible: the label goes when new commits arrive.
    name: Drop impact-reviewed on new commits
    if: >-
      (github.event.action == 'synchronize' || github.event.action == 'reopened') &&
      contains(github.event.pull_request.labels.*.name, 'impact-reviewed') &&
      !contains(fromJSON('["consigliere-release-bot[bot]","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Only "label not on the PR" (404) is fine; any other failure fails the job,
          # so a label that should have gone doesn't stay on silently.
          if ! out=$(gh api -X DELETE "repos/$REPO/issues/$PR/labels/impact-reviewed" 2>&1); then
            case "$out" in
              *"HTTP 404"*) echo "impact-reviewed was already removed" ;;
              *) echo "::error::Could not remove impact-reviewed: $out"; exit 1 ;;
            esac
          fi
