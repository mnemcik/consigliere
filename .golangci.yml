version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - errname
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - gosec
    - misspell
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
      # Don't count occurrences in _test.go files. Without this, a repeated
      # fixture/table literal in tests (e.g. "list", "init") pushes a single
      # non-test literal over the threshold and the issue is reported on the
      # non-test line — which the _test.go exclusion below can't suppress.
      # golangci-lint began scanning _test.go for goconst in v2.12.
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: unexported-return
          disabled: true
    gosec:
      excludes:
        - G301
        - G304
        - G306
  exclusions:
    rules:
      # goconst on test files flags repeated fixture/table literals (e.g. tag
      # and slug inputs), which hurts test readability more than it helps. Scope
      # goconst to non-test code — its useful domain, and the behavior before
      # golangci-lint v2.12 began scanning _test.go files.
      - path: _test\.go
        linters:
          - goconst
    paths:
      - cmd/embed_templates

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
